spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-customer
          uri: lb://ms-customer
          predicates:
            - Path=/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-account
          uri: lb://ms-account
          predicates:
            - Path=/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-credit
          uri: lb://ms-credit
          predicates:
            - Path=/credits/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-creditcard
          uri: lb://ms-creditcard
          predicates:
            - Path=/credit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-debitcard
          uri: lb://ms-debitcard
          predicates:
            - Path=/debit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-debt
          uri: lb://ms-debt
          predicates:
            - Path=/debts/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback
        - id: ms-wallet
          uri: lb://ms-wallet
          predicates:
            - Path=/wallets/**
          filters:
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      default:
        timeoutDuration: 2s

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
